name: PrivateRank CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-pipeline:
    name: Continuous Integration Checks
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies (Clean Install)
        run: npm ci

      - name: 4. TypeScript / Type Checking
        run: npm run typecheck

      - name: 5. Lint
        run: npm run lint

      - name: 6. Frontend & Application Logic Tests
        run: npm run test:frontend

      - name: 7. Smart Contract & On-Chain Lifecycle Tests
        run: npm run test:contract

      - name: 8. Smart Contract Bindings & Types Validation
        run: npm run contract:check

      - name: 9. Production Build
        run: npm run build
